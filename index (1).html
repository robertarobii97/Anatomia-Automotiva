<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Anatomia Automotiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: estação de engenharia — navegação por categorias | visor 3D (digital twin) | ficha do sistema */
:root{
  color-scheme:dark;
  --navy:#0B1628; --deep:#10243D; --mid:#174A83; --pri:#2878D0; --elec:#42A5FF; --ice:#DCEEFF;
  --bg:#080E18; --card:#111D2D; --card2:#152338; --bd:#263B54; --bd2:#1B2C42; --tx:#F1F5F9; --tx2:#94A3B8; --tx3:#64748B;
  --f-disp:"Barlow","Inter",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px; --sh:0 10px 30px rgba(2,6,14,.45); --ring:0 0 0 2px var(--bg),0 0 0 4px var(--elec);
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring)}
.ic{width:18px;height:18px;flex:none}.ic.sm{width:15px;height:15px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* ---------- Cabeçalho ---------- */
.top{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,var(--navy),#0a1424);border-bottom:1px solid var(--bd2);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,var(--pri),var(--mid));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 14px rgba(40,120,208,.35)}
.mark svg{width:22px;height:22px}
.org{display:block;font:600 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--elec)}
.brand h1{margin:0;font:700 20px/1.1 var(--f-disp);letter-spacing:.01em}
.vehnav{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;min-width:0}
.vgroup{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--bd2);border-radius:11px;padding:3px}
.vbrand{font:600 10px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:0 8px 0 7px}
.vbtns{display:flex;gap:2px}
.vbtns button{border:0;background:transparent;color:var(--tx2);font:600 13px var(--f-disp);letter-spacing:.02em;padding:7px 13px;border-radius:8px;cursor:pointer;transition:background .2s,color .2s}
.vbtns button:hover{color:var(--tx);background:var(--card)}
.vbtns button[aria-pressed="true"]{background:var(--pri);color:#fff;box-shadow:0 2px 10px rgba(40,120,208,.4)}

/* ---------- Estrutura ---------- */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr) 372px;min-height:0}
.nav{background:var(--navy);border-right:1px solid var(--bd2);overflow-y:auto;min-height:0;padding:14px 10px 20px}
.detail{background:var(--navy);border-left:1px solid var(--bd2);overflow-y:auto;min-height:0}
.nav::-webkit-scrollbar,.detail::-webkit-scrollbar{width:8px}.nav::-webkit-scrollbar-thumb,.detail::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}

/* ---------- Navegação por categorias ---------- */
.navhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 8px 10px}
.eyebrow{font:600 10.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.count{font:500 11px var(--f-mono);color:var(--tx3)}
.cats,.cats ul{list-style:none;margin:0;padding:0}
.cat{margin-bottom:2px;border-radius:10px}
.cat.multi{padding:2px 0 4px}
.catl,.sysb{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px}
.catl{color:var(--tx2);font:600 13px var(--f-body)}
.sysb{border:0;background:transparent;text-align:left;cursor:pointer;color:var(--tx2);position:relative;transition:background .18s,color .18s}
.sysb.single{font-weight:600;font-size:13px}
.sysb.sub{padding:6px 10px 6px 38px;font-size:13px}
.sysb.sub .ic{display:none}
.sysb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct{font:500 11px var(--f-mono);color:var(--tx3);background:var(--bg);border:1px solid var(--bd2);border-radius:6px;padding:1px 6px;min-width:26px;text-align:center}
.sysb:hover{background:var(--card);color:var(--tx)}
.sysb[aria-current="true"]{background:linear-gradient(90deg,rgba(40,120,208,.22),rgba(40,120,208,.06));color:#fff}
.sysb[aria-current="true"]::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--elec)}
.sysb[aria-current="true"] .ct{border-color:var(--pri);color:var(--ice)}
.cat.on>.catl,.cat.on>.sysb .ic{color:var(--elec)}
.cat.on .catl .ic{color:var(--elec)}

/* ---------- Visor 3D ---------- */
.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,#12284a 0%,#0b1628 46%,#080e18 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.ov{position:absolute;z-index:2}
.glass{background:rgba(13,24,40,.78);border:1px solid rgba(66,165,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--r);box-shadow:var(--sh)}
.vcard{left:16px;top:16px;padding:12px 16px 13px;max-width:min(340px,calc(100% - 140px))}
.vb{display:block;font:600 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--elec)}
.vn{display:block;font:700 28px/1.05 var(--f-disp);letter-spacing:.005em;margin-top:2px}
.vt{display:block;color:var(--tx2);font-size:12.5px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chips span{font-size:11.5px;color:var(--ice);background:rgba(40,120,208,.16);border:1px solid rgba(66,165,255,.22);border-radius:6px;padding:2px 7px}
.rail{right:16px;top:16px;display:flex;flex-direction:column;gap:8px;align-items:stretch;width:92px}
.tgrp{padding:5px;display:flex;flex-direction:column;gap:2px}
.tl{font:600 9.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:3px 5px 4px}
.tgrp button,.tbtn{border:0;background:transparent;color:var(--tx2);font:500 12px var(--f-body);padding:6px 7px;border-radius:7px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:6px;transition:background .18s,color .18s}
.tgrp button:hover,.tbtn:hover{background:rgba(40,120,208,.16);color:var(--tx)}
.tbtn[aria-pressed="true"]{color:var(--ice)}
.tbtn[aria-pressed="false"]{color:var(--tx3)}
#paints{flex-direction:row;flex-wrap:wrap;gap:6px;padding:5px 8px 9px}
#paints .tl{width:100%}
.sw{width:22px!important;height:22px;padding:0!important;border-radius:50%!important;background:var(--sw)!important;border:2px solid rgba(255,255,255,.12)!important;box-shadow:inset 0 -3px 6px rgba(0,0,0,.35)}
.sw[aria-pressed="true"]{border-color:var(--elec)!important;box-shadow:0 0 0 2px rgba(66,165,255,.35),inset 0 -3px 6px rgba(0,0,0,.35)}
.stage:not([data-mode="completo"]):not([data-mode="raiox"]) #paints{display:none}
.dock{left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:calc(100% - 32px)}
.modes{display:flex;gap:2px;padding:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--tx2);font:600 13px var(--f-disp);letter-spacing:.02em;padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.modes button:hover{color:var(--tx);background:rgba(40,120,208,.14)}
.modes button[aria-checked="true"]{background:var(--pri);color:#fff;box-shadow:0 2px 12px rgba(40,120,208,.45)}
.modetxt{font-size:11.5px;color:var(--tx2);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.explode{display:flex;align-items:center;gap:12px;padding:8px 12px;flex-wrap:wrap;justify-content:center}
.explode label{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--tx2)}
.explode input[type=range]{width:150px;accent-color:var(--elec)}
.seg{display:flex;gap:2px;background:var(--bg);border:1px solid var(--bd2);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:var(--tx2);font:500 12px var(--f-body);padding:4px 9px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--mid);color:#fff}
.pcard{left:16px;bottom:90px;width:min(340px,calc(100% - 140px));padding:14px 16px;border-left:3px solid var(--elec)}
.pk{display:flex;align-items:center;gap:6px;font:600 10.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--elec)}
.pcard h3{margin:6px 0 2px;font:700 18px/1.2 var(--f-disp);text-wrap:balance}
.pside{display:inline-block;font-size:11.5px;color:var(--ice);background:rgba(40,120,208,.18);border-radius:6px;padding:2px 7px;margin:2px 0 4px}
.pcard p{margin:4px 0 0;color:var(--tx2);font-size:13px}
.pact{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--f-body);padding:7px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);text-decoration:none;cursor:pointer;transition:background .18s,border-color .18s}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:#3088e0}
.btn.icon{margin-left:auto;padding:7px}
.stage[data-mode="explodida"] .pcard{bottom:140px}
.hiddenchip{top:16px;left:50%;transform:translateX(-50%);font:600 12px var(--f-body);color:var(--ice);padding:7px 12px;cursor:pointer;border-radius:999px}
.hint{right:16px;bottom:20px;font-size:11.5px;color:var(--tx3)}
.tip{left:0;top:0;pointer-events:none;font:500 12px var(--f-body);background:rgba(8,14,24,.92);border:1px solid var(--bd);color:var(--tx);padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:4}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:999px;background:rgba(13,24,40,.88);border:1px solid var(--bd);
  color:var(--tx);font:500 11.5px var(--f-body);white-space:nowrap;cursor:pointer;margin:0;translate:-50% -150%;will-change:transform;transition:background .15s,border-color .15s}
.lbl::after{content:"";position:absolute;left:50%;bottom:-8px;width:1px;height:7px;background:rgba(66,165,255,.6)}
.lbl b{font:500 10.5px var(--f-mono);display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--mid);color:#fff}
.lbl:hover{border-color:var(--pri)}
.lbl.on{background:var(--pri);border-color:var(--elec);z-index:2}.lbl.on b{background:#fff;color:var(--pri)}
.labels.grid .lbl{translate:-50% 30%}.labels.grid .lbl::after{display:none}
.stage.compact .labels:not(.grid) .lbl span{display:none}.stage.compact .labels:not(.grid) .lbl{padding:3px}
.loader{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,14,24,.82);z-index:6;transition:opacity .35s}
.loader.out{opacity:0;pointer-events:none}
.loader p{margin:0;font:600 14px var(--f-disp);letter-spacing:.04em;color:var(--ice);text-align:center;max-width:80%}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(66,165,255,.18);border-top-color:var(--elec);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{width:200px;height:3px;border-radius:3px;background:rgba(66,165,255,.16);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--elec);transition:width .2s}

/* ---------- Painel do sistema ---------- */
.dhead{padding:20px 20px 16px;border-bottom:1px solid var(--bd2);background:linear-gradient(180deg,var(--deep),var(--navy))}
.crumb{display:flex;align-items:center;gap:7px;font:600 10.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--elec)}
.dhead h2{margin:6px 0 6px;font:700 26px/1.1 var(--f-disp);text-wrap:balance}
.desc{margin:0;color:var(--tx2);font-size:13px;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stats div{background:var(--card);border:1px solid var(--bd2);border-radius:var(--r-sm);padding:8px 10px}
.stats b{display:block;font:500 18px var(--f-mono);color:var(--tx);font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--tx3)}
.filter{display:flex;align-items:center;gap:8px;margin:14px 16px 6px;padding:0 10px;background:var(--card);border:1px solid var(--bd2);border-radius:9px;color:var(--tx3)}
.filter:focus-within{border-color:var(--pri)}
.filter input{flex:1;min-width:0;background:transparent;border:0;color:var(--tx);font:13px var(--f-body);padding:9px 0;outline:none}
.plist{list-style:none;margin:0;padding:6px 12px 8px}
.pg{margin-bottom:4px}
.pg.multi{background:var(--card);border:1px solid var(--bd2);border-radius:10px;padding:9px 6px 6px}
.pgh{padding:0 6px 6px}
.pgh strong{display:block;font-weight:600;font-size:13.5px}
.pgh small,.pt small{display:block;color:var(--tx2);font-size:12.3px;line-height:1.4;margin-top:2px}
.subs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.prow{display:flex;align-items:stretch;border-radius:9px;border:1px solid transparent;transition:background .15s,border-color .15s}
.prow:hover{background:var(--card2)}
.prow.on{background:rgba(40,120,208,.16);border-color:var(--pri)}
.prow.off .pb{opacity:.45}
.prow.sub{background:var(--bg);border-color:var(--bd2)}.prow.sub:hover{border-color:var(--bd)}.prow.sub.on{background:rgba(40,120,208,.2);border-color:var(--pri)}
.pb{flex:1;min-width:0;display:flex;align-items:flex-start;gap:10px;border:0;background:transparent;text-align:left;cursor:pointer;padding:8px 6px 8px 8px;border-radius:9px}
.prow.sub .pb{align-items:center;padding:6px 4px 6px 6px}
.num{flex:none;font:500 10.5px var(--f-mono);display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--deep);border:1px solid var(--bd);color:var(--ice)}
.prow.on .num{background:var(--pri);border-color:var(--elec);color:#fff}
.pt{min-width:0}.pt strong{font-weight:600;font-size:13.5px}
.pt em{display:inline-block;font-style:normal;font-size:11px;color:var(--ice);background:rgba(40,120,208,.16);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.side{font-size:12.3px;color:var(--tx2);min-width:0}
.prow.sub .side{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eye{flex:none;border:0;background:transparent;color:var(--tx3);cursor:pointer;padding:0 8px;border-radius:8px;display:grid;place-items:center}
.eye:hover{color:var(--ice)}.eye[aria-pressed="true"]{color:var(--elec)}
.empty{color:var(--tx3);padding:14px 8px;font-size:13px}
.ficha{margin:10px 16px 0;background:var(--card);border:1px solid var(--bd2);border-radius:var(--r)}
.ficha summary{cursor:pointer;padding:12px 14px;font:600 13px var(--f-disp);letter-spacing:.03em;color:var(--ice);list-style:none;display:flex;justify-content:space-between}
.ficha summary::after{content:"+";color:var(--tx3)}.ficha[open] summary::after{content:"–"}
.ficha summary::-webkit-details-marker{display:none}
.ficha dl{margin:0;padding:0 14px 6px}
.ficha dl div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--bd2);font-size:12.5px}
.ficha dt{color:var(--tx3)}.ficha dd{margin:0;color:var(--tx)}
.fn{margin:0;padding:4px 14px 12px;font-size:11.5px;color:var(--tx3)}
.disc{margin:12px 16px 22px;font-size:11.5px;color:var(--tx3);line-height:1.5}

/* ---------- Responsivo ---------- */
@media (max-width:1180px){
  .shell{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr)}
  .nav{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--bd2);padding:8px 0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  .navhead,.catl,.sysb .ct{display:none}
  .cats{display:flex;gap:6px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));width:max-content}
  .cat,.cat.multi,.cat ul,.cat li{display:contents}
  .sysb,.sysb.sub{width:auto;white-space:nowrap;padding:7px 12px;background:var(--card);border:1px solid var(--bd2);border-radius:999px;font-size:12.5px;font-weight:600}
  .sysb.sub .ic{display:block}
  .sysb[aria-current="true"]{background:var(--pri);border-color:var(--elec)}
  .sysb[aria-current="true"]::before{display:none}
}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .shell{grid-template-columns:minmax(0,1fr)}
  .stage{height:68vh;min-height:420px}
  .detail{border-left:0;overflow:visible}
  .hint{display:none}
  .vehnav{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .vgroup{flex:none}
}
@media (max-width:620px){
  .vcard{padding:9px 12px;max-width:calc(100% - 128px)}.vn{font-size:21px}.chips{display:none}
  .rail{width:84px;right:10px;top:10px}.vcard{left:10px;top:10px}
  .modes button span{display:none}.modes button{padding:9px 12px}
  .modetxt{display:none}
  .pcard{left:10px;right:10px;width:auto;bottom:74px}
  .dock{bottom:10px}
  .subs{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" opacity=".55"/><path d="M12 4.5l2.4 7.5L12 19.5 9.6 12z" fill="#fff" fill-opacity=".9"/><path d="M12 12h0" stroke-width="3" stroke-linecap="round"/></svg></span>
      <div><span class="org">Compass Combustível</span><h1>Anatomia Automotiva</h1></div>
    </div>
    <nav class="vehnav" id="vehNav" aria-label="Escolha o veículo"></nav>
  </header>
  <div class="shell">
    <aside class="nav" id="nav" aria-label="Sistemas do veículo"></aside>
    <section class="stage" id="stage" data-mode="completo" aria-label="Modelo 3D interativo">
      <canvas id="c" aria-label="Modelo 3D do veículo e dos componentes"></canvas>
      <div class="labels" id="labels"></div>
      <div class="ov vcard glass" id="vcard"></div>
      <div class="ov rail">
        <div class="glass tgrp" id="views"></div>
        <div class="glass tgrp">
          <button type="button" class="tbtn" id="tgLabels" aria-pressed="true">Nomes</button>
          <button type="button" class="tbtn" id="btnReset" title="Volta ao veículo completo">Veículo completo</button>
        </div>
        <div class="glass tgrp" id="paints"></div>
      </div>
      <div class="ov dock">
        <div class="glass explode" id="explodePanel" hidden>
          <label for="exr">Afastamento <input type="range" id="exr" min="0" max="100" value="70"></label>
          <div class="seg" role="group" aria-label="Peças afastadas"><button type="button" data-scope="sys" aria-pressed="true">Sistema</button><button type="button" data-scope="all" aria-pressed="false">Todas as peças</button></div>
        </div>
        <span class="modetxt" id="modeTxt"></span>
        <div class="glass modes" id="modes" role="radiogroup" aria-label="Modo de visualização"></div>

class Helix extends THREE.Curve{constructor(r,h,n){super();this.r=r;this.h=h;this.n=n}
  getPoint(t,o=new THREE.Vector3()){const a=t*Math.PI*2*this.n;return o.set(Math.cos(a)*this.r,t*this.h-this.h/2,Math.sin(a)*this.r)}}
function geo(s){const t=s[0];let g;
  if(t==='b')g=new THREE.BoxGeometry(s[1],s[2],s[3]);
  else if(t==='c'){g=new THREE.CylinderGeometry(s[1],s[1],s[2],32);if(s[3]==='x')g.rotateZ(Math.PI/2);if(s[3]==='z')g.rotateX(Math.PI/2);}
  else if(t==='s')g=new THREE.SphereGeometry(s[1],28,18);
  else if(t==='t'){g=new THREE.TorusGeometry(s[1],s[2],18,48);if(s[3]==='x')g.rotateY(Math.PI/2);if(s[3]==='y')g.rotateX(Math.PI/2);}
  else if(t==='arch')g=new THREE.TorusGeometry(s[1],s[2],10,36,Math.PI);
  else if(t==='spring')g=new THREE.TubeGeometry(new Helix(s[1],s[2],5),160,.009,8,false);
  return g;}
function material(k){const d=MATS[k]||MATS.metal;
  const m=new THREE.MeshStandardMaterial({color:d.c,metalness:d.m||0,roughness:d.r==null?.6:d.r,emissive:d.e||0,emissiveIntensity:d.ei||0});
  m.userData={o:d.o||1,e:d.e||0,ei:d.ei||0}; return m;}

function ori(g,ax){if(ax==='x')g.rotateZ(-PI/2);else if(ax==='z')g.rotateX(PI/2);else if(ax==='-x')g.rotateZ(PI/2);else if(ax==='-z')g.rotateX(-PI/2);return g;}
const BX=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const CY=(r1,r2,h,ax,seg,open)=>ori(new THREE.CylinderGeometry(r1,r2,h,seg||32,1,!!open),ax);
const SP=(r)=>new THREE.SphereGeometry(r,24,16);
const TO=(R,t,ax,arc)=>{const g=new THREE.TorusGeometry(R,t,12,48,arc||PI*2);if(ax==='x')g.rotateY(PI/2);if(ax==='y')g.rotateX(PI/2);return g;};
function RB(w,h,d,r){r=Math.min(r,w/2-.001,h/2-.001,d/2-.001);const s=new THREE.Shape(),a=w/2-r,b=h/2-r;
  s.moveTo(-a,-b);s.lineTo(a,-b);s.lineTo(a,b);s.lineTo(-a,b);s.lineTo(-a,-b);
  const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(.0005,d-2*r),bevelEnabled:true,bevelSize:r,bevelThickness:r,bevelSegments:3,curveSegments:4});
  g.translate(0,0,-(d-2*r)/2);return g;}
function LA(pts,ax,seg){const g=new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg||48);return ori(g,ax);}
function TU(pts,r,closed,rs){const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],p[1],p[2])),!!closed);return new THREE.TubeGeometry(c,closed?120:48,r,rs||10,!!closed);}
function SH(pts,depth){const s=new THREE.Shape();pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false});g.translate(0,0,-depth/2);return g;}
const P=(g,p,m,r)=>({g,p:p||[0,0,0],m,r});
function boot(r1,r2,len,ax,n){const pts=[];n=n||6;for(let i=0;i<=n*4;i++){const t=i/(n*4),y=-len/2+t*len,base=r1+(r2-r1)*t;pts.push([base*(1+.18*Math.sin(t*n*2*PI)),y]);}return LA(pts,ax,28);}
function arcLeaf(L,th,sag,d){const pts=[],N=16;for(let i=0;i<=N;i++){const x=-L/2+L*i/N;pts.push([x,sag*Math.pow(2*x/L,2)+th/2]);}
  for(let i=N;i>=0;i--){const x=-L/2+L*i/N;pts.push([x,sag*Math.pow(2*x/L,2)-th/2]);}return SH(pts,d);}

// tubos curvos ao longo de um eixo (len), com curvatura suave
function curva(len,ax,bend,waves){const pts=[];const n=8;for(let i=0;i<=n;i++){const t=i/n,a=-len/2+len*t,o=bend*Math.sin(t*PI*(waves||1));
  pts.push(ax==='x'?[a,o,0]:ax==='y'?[o,a,0]:[o*.6,o,a]);}return pts;}
// painel com recorte da caixa de roda (plano x-y, extrudado em z)
function painelArco(w,h,d,cx,cy,r){const L=-w/2,R=w/2,T=h/2,Bo=-h/2,pts=[[L,T],[L,Bo]];const dy=Bo-cy;
  if(Math.abs(dy)<r){let a1=Math.atan2(dy,-Math.sqrt(r*r-dy*dy)),a2=Math.atan2(dy,Math.sqrt(r*r-dy*dy));
    if(cx+r*Math.cos(a1)<L){a1=Math.acos((L-cx)/r);pts.pop();pts.push([L,cy+r*Math.sin(a1)]);}
    if(cx+r*Math.cos(a2)>R){a2=Math.acos((R-cx)/r);}
    if(a1<0)a1+=2*PI;const N=24;for(let i=0;i<=N;i++){const a=a1+(a2-a1)*i/N;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}
    const last=pts[pts.length-1];if(last[0]<R)pts.push([R,Math.max(Bo,last[1])]);}
  else pts.push([R,Bo]);pts.push([R,T]);return SH(pts,d);}

const v3=new THREE.Vector3();let last=performance.now();
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;const k=reduce?1:1-Math.exp(-dt*8);
 if(anim){anim.t=Math.min(1,anim.t+dt/.75);const e=1-Math.pow(1-anim.t,3);controls.target.lerpVectors(anim.ft,anim.tt,e);camera.position.lerpVectors(anim.fp,anim.tp,e);if(anim.t>=1)anim=null;}
 controls.update();
 if(SHELL){SHELL.mats.forEach(o=>{o.cur+=(o.tgt-o.cur)*k;const m=o.m;m.opacity=o.cur;m.transparent=o.kind==='glass'||o.cur<.995;m.depthWrite=o.kind!=='glass'&&o.kind!=='gap'&&o.cur>.6;});
  SHELL.meshes.forEach(ms=>{const o=ms.userData.mo;ms.visible=o.cur>.004;ms.castShadow=o.cur>.9&&o.kind!=='glass'&&o.kind!=='gap';});
  const lm=SHELL.lines.material;lm.opacity+=(lm.userData.tgt-lm.opacity)*k;SHELL.lines.visible=lm.opacity>.004;}
 for(const pr of PARTS){pr.obj.position.lerp(pr.tp,k);pr.obj.scale.lerp(pr.ts,k);
  for(const m of pr.meshes){const mt=m.material;mt.opacity+=(mt.userData.tgt-mt.opacity)*k;mt.transparent=mt.opacity<.995;mt.depthWrite=mt.opacity>.6;m.visible=mt.opacity>.01;m.castShadow=mt.opacity>.9;}}
 if(state.part>=0&&!reduce){const ei=.42+.22*Math.sin(now*.005);PARTS.forEach(pr=>{if(pr.si===state.sys&&pr.pi===state.part)pr.meshes.forEach(m=>m.material.emissiveIntensity=ei);});}
 if(hoverReq&&!dragging&&!anim){const h=pickAt(hoverReq[0],hoverReq[1]);const pr=h&&!h.shell?PARTS.find(p=>p.si===h.s&&p.pi===h.i):null;setHover(pr||null,h&&h.shell?h.shell:null,hoverReq[0],hoverReq[1]);hoverReq=null;}
 renderer.render(scene,camera);
 const showL=state.labels&&state.mode!=='completo';labelsEl.hidden=!showL;
 if(showL&&labelEls.length){const w=stage.clientWidth,h=stage.clientHeight;
  PARTS.forEach(pr=>{if(pr.si!==state.sys)return;const l=labelEls[pr.pi];if(!l)return;const op=pr.meshes.length?pr.meshes[0].material.opacity:0;
   if(op<.5){l.hidden=true;return;}v3.copy(pr.c).multiplyScalar(Math.abs(pr.obj.scale.y)).add(pr.obj.position).project(camera);
   if(v3.z>1||v3.z<-1){l.hidden=true;return;}l.hidden=false;l.style.transform='translate('+((v3.x+1)/2*w).toFixed(1)+'px,'+((1-v3.y)/2*h).toFixed(1)+'px)';});}
 requestAnimationFrame(frame);}

// ---------- Início ----------
function parseHash(){const h=(location.hash||'').slice(1).split('-'),hasV=!!VEH[h[0]],v=hasV?h[0]:'strada',id=hasV?h.slice(1).join('-'):h.join('-');
 const si=SYS.findIndex(x=>x.id===id);return [v,si<0?SYS_IDX.motor:si];}
window.addEventListener('hashchange',()=>{if(!V)return;const [v,i]=parseHash();if(v!==V.id)setVehicle(v,i);else if(i!==state.sys)selectSys(i);});
resize();syncModeUI();
const [v0,s0]=parseHash();setVehicle(v0,s0);
requestAnimationFrame(frame);

})();
</script>
